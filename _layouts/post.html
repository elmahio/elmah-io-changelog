---
layout: default
---
<article class="entry">
  <a class="back" href="{{ '/' | relative_url }}">&larr; All changes</a>
  <div class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.categories.first %}<span class="badge badge-{{ page.categories.first | downcase }}">{{ page.categories.first }}</span>{% endif %}
  </div>
  <h1>{{ page.title }}</h1>
  <div class="body">{{ content }}</div>
</article>
